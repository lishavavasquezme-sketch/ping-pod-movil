<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PING POD · Prototipo móvil</title>
<style>
:root{--o:#FF4500;--n:#111827;--g:#64748B;--b:#E2E8F0;--bg:#F8FAFC;--ok:#10B981;--r:#DC2626;--y:#F59E0B}
*{box-sizing:border-box;margin:0;font-family:Inter,system-ui,-apple-system,sans-serif}
body{background:#0B1018;display:flex;justify-content:center;height:100vh}
#ph{width:100%;max-width:400px;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;color:var(--n);margin:auto}
@media(min-width:500px){#ph{height:min(844px,96vh);border-radius:34px;border:8px solid #1f2937}}
#app{flex:1;overflow-y:auto;padding:0 16px 80px}
.top{display:flex;align-items:center;gap:10px;padding:16px 0 8px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:19px;flex:1}.top small{display:block;font-size:12px;color:var(--g);font-weight:400;margin-top:2px}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 1px var(--b);display:grid;place-items:center;cursor:pointer;flex:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.btn{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid var(--b);background:#fff;font-weight:600;font-size:14px;cursor:pointer;margin:8px 0;color:var(--n)}
.btn.p{background:var(--o);border-color:var(--o);color:#fff}.btn.d{background:var(--n);color:#fff}
.btn.s{display:inline-block;width:auto;padding:9px 14px;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--b);background:#fff;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--o);color:#fff;border-color:var(--o)}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:#EEF2F6;color:#334155}
.tag.g{background:#D1FAE5;color:#065F46}.tag.y{background:#FEF3C7;color:#92400E}.tag.r{background:#FEE2E2;color:#991B1B}
.k{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k .card{margin:0}
.k b{font-size:26px;display:block;margin:4px 0}.k span{font-size:12px;color:var(--g)}
label{font-size:12px;font-weight:600;color:#475569;display:block;margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;font-size:14px;background:#fff}
.al{border:1px solid var(--y);background:#FFFBEB;border-radius:12px;padding:12px;margin:8px 0;font-size:13px;cursor:pointer}
.al.r{border-color:var(--r);background:#FEF2F2}.al b{display:block;font-size:14px;margin-bottom:3px}
.tg{width:44px;height:26px;border-radius:99px;background:#CBD5E1;position:relative;cursor:pointer;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ok)}.tg.on:after{left:21px}
.av{width:40px;height:40px;border-radius:50%;background:#FFE4D6;color:var(--o);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b);cursor:pointer}.li:last-child{border:0}
.li div b{display:block;font-size:14px}.li div span{font-size:12px;color:var(--g)}
.bar{height:9px;border-radius:9px;background:#E8EDF3;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#475569;margin:18px 0 6px}
.ok{text-align:center;padding:60px 10px}.ok .c{width:72px;height:72px;border-radius:50%;background:#D1FAE5;color:var(--ok);display:grid;place-items:center;margin:0 auto 18px}
.ok .c svg{width:36px;height:36px}.ok h2{margin-bottom:8px}.ok p{color:var(--g);font-size:14px;margin-bottom:20px}
nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--b);padding:8px 0 12px}
nav button{flex:1;border:0;background:none;font-size:11px;color:var(--g);display:grid;justify-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--o);font-weight:600}
#cm{position:absolute;right:12px;bottom:84px;width:44px;height:44px;border-radius:50%;border:0;background:var(--n);color:#fff;z-index:20;cursor:pointer;display:grid;place-items:center}
#sh{position:absolute;inset:auto 0 0 0;background:#fff;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -8px 30px #0003;z-index:30;display:none;max-height:70%;overflow:auto}
#ts{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;display:none}
.lg{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:30px 0}
.lg .logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,#FF4500,#FF8A00);margin:0 auto 10px;display:grid;place-items:center;color:#fff}
.lg h1{text-align:center}.lg small{text-align:center;color:var(--o);font-weight:600;font-size:12px;margin-bottom:20px;display:block}
</style></head>
<body><div id="ph"><div id="ts"></div><div id="app"></div><button id="cm" data-cm title="Comentarios"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button><div id="sh"></div><nav id="nav"></nav></div>
<script>
const I={home:"M3 11l9-8 9 8v10H3z",users:"M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M22 21v-2a4 4 0 00-3-3.9",check:"M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11",cal:"M3 4h18v18H3zM16 2v4M8 2v4M3 10h18",menu:"M3 6h18M3 12h18M3 18h18",bell:"M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0",back:"M15 18l-6-6 6-6",ok:"M20 6L9 17l-5-5",x:"M18 6L6 18M6 6l12 12",plus:"M12 5v14M5 12h14"};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${I[n]}"/></svg>`;
const A=[["Santiago Morales","Sub-15","Activo","Tarde Alto Rendimiento",1650],["Valentina Gómez","Sub-13","Activo","Mañana Semillero",1540],["Mateo Rodríguez","Absoluta","Pendiente","Tarde Elite",1792],["Sofía Espinosa","Sub-15","Inactivo","Sábados Recreativo",1310],["Alejandro Castro","Sub-13","Activo","Mañana Semillero",1395],["Gabriela Ruiz","Absoluta","Activo","Tarde Elite",1845],["Daniel Felipe Patiño","Sub-15","Pendiente","Tarde Alto Rendimiento",1492],["Isabella Montenegro","Sub-13","Activo","Mañana Semillero",1420]];
const ini=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
const st=s=>s=="Activo"?"g":s=="Pendiente"?"y":"";
const hd=(t,sub,back)=>`<div class="top">${back?`<button class="ib" data-back>${ic("back")}</button>`:""}<h1>${t}${sub?`<small>${sub}</small>`:""}</h1><button class="ib" data-go="notifs">${ic("bell")}</button></div>`;
const ok=(t,m,to,l)=>`data-ok="${t}|${m}|${to||"home"}|${l||"Volver al inicio"}"`;
const f=(l,v,t)=>`<label>${l}</label><input type="${t||"text"}" value="${v||""}" placeholder="${v?"":l}">`;
const sel=(l,o)=>`<label>${l}</label><select>${o.map(x=>`<option>${x}</option>`).join("")}</select>`;
const tg=(on)=>`<div class="tg ${on?"on":""}"></div>`;
const form=(t,sub,body,btn,msg,to,l)=>hd(t,sub,1)+`<div class="card">${body}</div><button class="btn p" ${ok(btn.replace("Guardar","Cambios guardados"),msg,to,l)}>${btn}</button><button class="btn" data-back>Cancelar</button>`;
const S={
login:()=>`<div class="lg"><div class="logo">${ic("x")}</div><h1>PING POD</h1><small>LIGA DE BOGOTÁ • COACH PORTAL</small>${f("Correo electrónico","coach.maria@ligabogota.co","email")}${f("Contraseña","••••••••••••","password")}<p style="text-align:right;margin:8px 0"><a data-go="forgot" style="color:var(--o);font-size:13px;font-weight:600;cursor:pointer">¿Olvidaste tu contraseña?</a></p><button class="btn p" data-go="twofa">Iniciar sesión</button></div>`,
forgot:()=>hd("Recuperar contraseña","Te enviaremos un enlace a tu correo",1)+`<div class="card">${f("Correo electrónico","","email")}</div><button class="btn p" ${ok("Enlace enviado","Revisa tu correo para restablecer tu contraseña.","login","Volver a iniciar sesión")}>Enviar enlace</button>`,
twofa:()=>`<div class="lg"><h1>Verificación de dos pasos</h1><small style="color:var(--g);font-weight:400">Ingresa el código temporal de tu aplicación autorizadora.</small>${f("Código de 6 dígitos","592 341")}<button class="btn d" data-go="home" data-reset>Verificar</button><button class="btn" data-back>Volver</button></div>`,
home:()=>hd("Hola, Coach María","Centro de rendimiento · Liga de Bogotá")+`<h3>Acciones rápidas</h3><div class="row"><button class="btn p s" data-go="newath">+ Deportista</button><button class="btn s" data-go="newses">Entrenamiento</button><button class="btn s" data-go="newtor">Torneo</button></div><h3>Resumen</h3><div class="k"><div class="card"><span>Total deportistas</span><b>48</b><span>Activos en la Liga</span></div><div class="card"><span>Entrenamientos (semana)</span><b>12</b><span>Completados o agendados</span></div><div class="card" data-go="tournaments"><span>Próximo torneo</span><b>En 12 días</b><span>Torneo de Cierre</span></div><div class="card" data-go="reports"><span>Asistencia promedio</span><b>87%</b><span style="color:var(--ok)">↑ 2% vs mes anterior</span></div></div><h3>Alertas de gestión</h3><div class="al" data-go="athlete" data-arg="0"><b>Documento por vencer</b>Certificado médico de Santiago Morales vence en 3 días.</div><div class="al r" data-go="inventory"><b>Bajo stock de pelotas</b>Quedan 12 pelotas DHS 3 estrellas en inventario.</div><div class="al" data-go="tournaments"><b>Torneo sin resultados</b>Liga interna del sábado requiere registrar marcadores.</div><h3>Actividad reciente</h3><div class="card"><div class="li"><div><b>Coach Rodríguez registró la asistencia</b><span>Grupo Sub-15 · hace 10 min</span></div></div><div class="li"><div><b>Nuevo atleta: Mateo Gómez</b><span>Categoría Sub-13 · hace 2 horas</span></div></div></div>`,
notifs:()=>hd("Notificaciones","",1)+`<div class="card"><div class="li" data-go="athlete" data-arg="0"><div><b>Documento por vencer</b><span>Certificado médico de Santiago Morales</span></div></div><div class="li" data-go="inventory"><div><b>Stock bajo</b><span>Pelotas DHS 3 estrellas</span></div></div><div class="li" data-go="calendar"><div><b>Conflicto de agenda</b><span>Mesa 3 reservada dos veces el martes</span></div></div></div>`,
athletes:()=>hd("Deportistas","48 inscritos en la Liga")+`<input id="q" placeholder="Buscar por nombre o documento"><div class="chips">${["Todos","Sub-13","Sub-15","Absoluta"].map((c,i)=>`<span class="chip ${i?"":"on"}" data-f="${c}">${c}</span>`).join("")}</div><button class="btn" data-go="ranking">Ver Ranking ELO</button><div class="card" id="al">${A.map((a,i)=>`<div class="li" data-go="athlete" data-arg="${i}" data-c="${a[1]}" data-n="${a[0].toLowerCase()}"><div class="av">${ini(a[0])}</div><div style="flex:1"><b>${a[0]}</b><span>${a[1]} · ${a[3]}</span></div><span class="tag ${st(a[2])}">${a[2]}</span></div>`).join("")}</div><button class="btn p" data-go="newath">+ Nuevo deportista</button>`,
athlete:i=>{const a=A[i||0],t=S._t||"Información";const tabs=["Información","Historial","Documentos","Plan"];const body=t=="Información"?f("Nombres",a[0].split(" ")[0])+f("Apellidos",a[0].split(" ").slice(1).join(" "))+f("Fecha de nacimiento","15 / 08 / 2012")+f("Teléfono del acudiente","310 555 0142")+f("EPS","Sanitas"):t=="Historial"?`<div class="li"><div><b>Torneo Apertura Sub-15</b><span>Semifinalista · Oct 2026</span></div></div><div class="li"><div><b>Liga interna</b><span>10 victorias consecutivas</span></div></div>`:t=="Documentos"?`<div class="li"><div><b>Tarjeta de identidad</b><span>Vigente</span></div><span class="tag g">OK</span></div><div class="li"><div><b>Certificado médico</b><span>Vence en 3 días</span></div><span class="tag y">Por vencer</span></div><div class="li"><div><b>Autorización de padres</b><span>Falta firma</span></div><span class="tag r">Falta</span></div>`:`<div class="li"><div><b>Lunes y miércoles</b><span>Alto Rendimiento · 16:00</span></div></div><div class="li"><div><b>Jueves</b><span>Técnica y revés · 18:00</span></div></div>`;return hd("Ficha del deportista","",1)+`<div class="card" style="text-align:center"><div class="av" style="margin:0 auto 8px;width:64px;height:64px;font-size:20px">${ini(a[0])}</div><b>${a[0]}</b><div style="margin-top:6px"><span class="tag">${a[1]}</span> <span class="tag ${st(a[2])}">${a[2]}</span></div></div><div class="chips">${tabs.map(x=>`<span class="chip ${x==t?"on":""}" data-t="${x}" data-i="${i}">${x}</span>`).join("")}</div><div class="card">${body}</div><button class="btn p" ${ok("Deportista actualizado","Los datos de "+a[0]+" se guardaron correctamente.","athletes","Ver deportistas")}>Guardar cambios</button>`},
newath:()=>form("Nuevo deportista","Registra un jugador en la Liga",f("Nombres")+f("Apellidos")+f("Fecha de nacimiento","","date")+sel("Categoría",["Sub-13","Sub-15","Absoluta"])+f("Teléfono del acudiente"),"Guardar deportista","El deportista quedó registrado en estado Pendiente.","athletes","Ver deportistas"),
ranking:()=>hd("Ranking ELO","Rendimiento por puntuación",1)+`<div class="card">${[...A].sort((a,b)=>b[4]-a[4]).map((a,i)=>`<div class="li" data-go="elo" data-arg="${A.indexOf(a)}"><b style="width:26px">#${i+1}</b><div style="flex:1"><b>${a[0]}</b><span>${a[1]}</span></div><b>${a[4]}</b></div>`).join("")}</div>`,
elo:i=>{const a=A[i];return hd(a[0],"Histórico ELO · 6 meses",1)+`<div class="card"><b style="font-size:24px">${a[4]} pts</b><svg viewBox="0 0 300 120" style="width:100%;height:140px;stroke:var(--o)"><polyline points="10,90 60,80 110,82 160,60 210,40 290,20"/></svg><div class="row sp" style="font-size:11px;color:var(--g)"><span>May</span><span>Jul</span><span>Sep</span><span>Oct</span></div></div>`},
attendance:()=>hd("Asistencia","Grupo Sub-15 · Miércoles 11 Nov · 9:00–11:00")+`<div class="card"><div class="row sp"><span>Presentes</span><b id="pc">5 / 8</b></div><div class="bar" style="margin-top:8px"><i id="pb" style="width:62%"></i></div></div><div class="card">${A.map((a,i)=>`<div class="li"><div class="av">${ini(a[0])}</div><b style="flex:1;font-size:14px">${a[0]}</b><div class="tg att ${[0,1,0,1,1,1,0,1][i]?"on":""}"></div></div>`).join("")}</div><label>Observaciones de la sesión</label><textarea rows="3">Buen ritmo de entrenamiento.</textarea><button class="btn p" ${ok("Asistencia guardada","La asistencia de la sesión se registró correctamente.","home")}>Guardar asistencia</button>`,
calendar:()=>hd("Calendario","Semana del 9 al 14 de noviembre de 2026")+`<div class="chips">${["Lun 9","Mar 10","Mié 11","Jue 12","Vie 13","Sáb 14"].map((d,i)=>`<span class="chip ${i==2?"on":""}">${d}</span>`).join("")}</div><div class="card"><div class="li"><div><b>Sub-15 · Mañana</b><span>Rodríguez · 9:00–11:00 · Mesas 1, 2 y 3</span></div></div><div class="li"><div><b>Alto Rendimiento · Tarde</b><span>María R. · 16:00 · Mesas 1 y 2</span></div></div></div><div class="al r"><b>Conflicto detectado</b>Coach Rodríguez ya tiene sesión el martes 10 de 9:00 a 11:00 en Mesa 3.</div><button class="btn p" data-go="newses">+ Nueva sesión</button><button class="btn" data-go="trips">Viajes y convocatorias</button>`,
newses:()=>form("Nueva sesión","Programar entrenamiento",sel("Jornada",["Mañana","Tarde"])+sel("Grupo",["Grupo Sub-15","Grupo Sub-13","Alto Rendimiento"])+sel("Entrenador",["Coach Rodríguez","Coach María R."])+f("Fecha","11 / 11 / 2026")+f("Hora inicio","09:00 AM")+f("Hora fin","11:00 AM"),"Guardar sesión","La sesión quedó agendada en el calendario.","calendar","Ver calendario"),
tournaments:()=>hd("Torneos","Eliminación directa")+`<div class="card" data-go="bracket"><div class="row sp"><b>Torneo Apertura Sub-15</b><span class="tag g">En curso</span></div><span style="font-size:12px;color:var(--g)">12–28 oct 2026 · 16 participantes</span></div><div class="card" data-go="info" data-arg="Torneo de Cierre|Programado del 14 al 15 de noviembre de 2026, sede Sala principal, categorías Sub-15 y Sub-18."><div class="row sp"><b>Torneo de Cierre</b><span class="tag y">Programado</span></div><span style="font-size:12px;color:var(--g)">14–15 nov 2026 · 16 de 32 cupos</span></div><button class="btn p" data-go="newtor">+ Crear torneo</button>`,
bracket:()=>hd("Torneo Apertura Sub-15","Llaves y resultados",1)+`<h3>Cuartos de final</h3><div class="card"><div class="li"><div><b>S. Morales vs M. Rodríguez</b><span>Pendiente</span></div><span class="tag y">Pend.</span></div><div class="li"><div><b>D. Patiño vs Ganador M4</b><span>Pendiente</span></div><span class="tag y">Pend.</span></div></div><h3>Octavos</h3><div class="card"><div class="li"><div><b>S. Morales 3 – 1 A. Castro</b></div><span class="tag g">Final</span></div><div class="li"><div><b>V. Gómez 2 – 3 M. Rodríguez</b></div><span class="tag g">Final</span></div></div><button class="btn p" data-go="result">Registrar resultado</button>`,
result:()=>form("Registrar resultado","Torneo Apertura Sub-15",sel("Partido",["Santiago Morales vs. Mateo Rodríguez"])+f("Sets Santiago Morales","3","number")+f("Sets Mateo Rodríguez","1","number")+`<label>Notas de arbitraje</label><textarea rows="3">Parciales: 11-8, 9-11, 11-5, 11-9.</textarea>`,"Guardar resultado","Resultado guardado, ranking actualizado.","tournaments","Ver torneos"),
newtor:()=>form("Crear torneo","Interno o externo",sel("Tipo",["Interno","Externo"])+f("Nombre","Torneo de Cierre — Noviembre 2026")+f("Fecha de inicio","14 / 11 / 2026")+f("Fecha de fin","15 / 11 / 2026")+sel("Categorías",["Sub-15 y Sub-18","Sub-13","Absoluta"])+sel("Cupo máximo",["32 participantes","16 participantes"]),"Crear torneo","El torneo se creó. Ahora puedes gestionar llaves y resultados.","tournaments","Ver torneos"),
more:()=>hd("Más opciones")+`<div class="card">${[["inventory","Inventario de equipos"],["uniforms","Uniformes y dotación"],["badges","Insignias"],["trips","Viajes y convocatorias"],["reports","Reportes"],["tournaments","Torneos"],["account","Mi cuenta"]].map(m=>`<div class="li" data-go="${m[0]}"><b style="flex:1;font-size:14px">${m[1]}</b>›</div>`).join("")}<div class="li" data-go="login" data-reset><b style="color:var(--r);font-size:14px">Cerrar sesión</b></div></div>`,
inventory:()=>hd("Inventario","Mesas, mallas, raquetas y pelotas",1)+`<div class="al r"><b>Stock bajo</b>Pelotas DHS 3 estrellas — quedan 12 unidades.</div><div class="k"><div class="card"><span>Total</span><b>128</b></div><div class="card"><span>Disponibles</span><b>112</b></div><div class="card"><span>Mantenimiento</span><b>11</b></div><div class="card"><span>De baja</span><b>5</b></div></div><div class="card">${[["EQ-001","Mesa Butterfly Centrefold 25","Disponible"],["EQ-003","Mesa Donic Waldner 25","Mantenimiento"],["EQ-006","Raqueta Butterfly Timo Boll","Mantenimiento"],["EQ-007","Pelotas DHS 3-Star D40+","De baja"]].map(e=>`<div class="li" data-go="info" data-arg="${e[0]}|${e[1]} · Estado: ${e[2]}. Desde aquí puedes editar ubicación, estado y fecha de adquisición."><div style="flex:1"><b>${e[1]}</b><span>${e[0]}</span></div><span class="tag ${e[2]=="Disponible"?"g":e[2]=="De baja"?"r":"y"}">${e[2]}</span></div>`).join("")}</div><button class="btn p" data-go="addeq">+ Agregar equipo</button>`,
addeq:()=>form("Agregar equipo","Nuevo registro de inventario",f("Código","EQ-008")+sel("Tipo",["Mesa","Malla","Raqueta","Pelotas"])+f("Marca / modelo")+f("Ubicación","Salón Principal"),"Guardar equipo","El equipo se agregó al inventario.","inventory","Ver inventario"),
uniforms:()=>hd("Uniformes","Inventario, tallas y entregas",1)+`<div class="al"><b>Stock bajo</b>Talla M camiseta — quedan 2 unidades.</div><div class="card">${[["Santiago Morales","Completo"],["Valentina Gómez","Incompleto"],["Mateo Rodríguez","Completo"],["Sofía Espinosa","Incompleto"]].map(u=>`<div class="li" data-go="info" data-arg="${u[0]}|Estado de dotación: ${u[1]}. Aquí ves tallas de camiseta, pantaloneta y chaqueta, y entregas pendientes."><div style="flex:1"><b>${u[0]}</b></div><span class="tag ${u[1]=="Completo"?"g":"y"}">${u[1]}</span></div>`).join("")}</div><button class="btn p" data-go="assign">Asignar uniforme</button>`,

};
const tabs=[["home","Inicio","home"],["athletes","Deportistas","users"],["attendance","Asistencia","check"],["calendar","Calendario","cal"],["more","Más","menu"]];
let stack=[],cur="login",arg=null;
const app=document.getElementById("app"),nav=document.getElementById("nav");
function draw(){app.innerHTML=S[cur](arg);app.scrollTop=0;const m=!["login","forgot","twofa"].includes(cur);nav.style.display=m?"flex":"none";document.getElementById("cm").style.display=m?"grid":"none";const grp={athletes:["athlete","newath","ranking","elo"],calendar:["newses","trips"],more:["inventory","uniforms","badges","reports","account","tournaments","bracket","result","newtor"]};const act=tabs.find(t=>t[0]==cur||(grp[t[0]]||[]).includes(cur));nav.innerHTML=tabs.map(t=>`<button class="${act&&act[0]==t[0]?"on":""}" data-go="${t[0]}" data-reset>${ic(t[2])}${t[1]}</button>`).join("")}
function go(n,a,reset){if(reset)stack=[];else stack.push([cur,arg]);cur=n;arg=a;if(n!="athlete")S._t=null;draw()}
function toast(t){const e=document.getElementById("ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
const C=()=>JSON.parse(localStorage.getItem("pp_c")||"{}");
document.addEventListener("click",e=>{const t=e.target.closest("[data-go],[data-back],[data-ok],[data-f],[data-t],.tg,[data-cm]");if(!t)return;
if(t.dataset.cm!==undefined){const s=document.getElementById("sh");if(s.style.display=="block"){s.style.display="none";return}const c=(C()[cur]||[]);s.innerHTML=`<b>Comentarios · ${cur}</b>${c.map(x=>`<div class="card" style="font-size:13px">${x}</div>`).join("")||'<p style="font-size:13px;color:var(--g);margin:8px 0">Aún no hay comentarios en esta pantalla.</p>'}<textarea id="ct" rows="2" placeholder="Escribe un comentario"></textarea><button class="btn p" data-sc>Enviar comentario</button>`;s.style.display="block";return}
if(t.hasAttribute("data-sc")){return}
if(t.dataset.back!==undefined){const p=stack.pop();if(p){cur=p[0];arg=p[1];draw()}return}
if(t.dataset.ok){go("done",t.dataset.ok,true);return}
if(t.dataset.f){document.querySelectorAll("[data-f]").forEach(c=>c.classList.toggle("on",c==t));document.querySelectorAll("#al .li").forEach(r=>r.style.display=t.dataset.f=="Todos"||r.dataset.c==t.dataset.f?"flex":"none");return}
if(t.dataset.t){S._t=t.dataset.t;arg=t.dataset.i;draw();return}
if(t.classList.contains("tg")){t.classList.toggle("on");if(t.classList.contains("att")){const n=document.querySelectorAll(".att.on").length;document.getElementById("pc").textContent=n+" / 8";document.getElementById("pb").style.width=n/8*100+"%"}return}
const a=t.dataset.arg;go(t.dataset.go,t.dataset.go=="athlete"||t.dataset.go=="elo"?+a:a,t.dataset.reset!==undefined)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-sc]");if(!b)return;const v=document.getElementById("ct").value.trim();if(!v)return;const c=C();(c[cur]=c[cur]||[]).push(v);try{localStorage.setItem("pp_c",JSON.stringify(c))}catch(x){}document.getElementById("sh").style.display="none";toast("Comentario guardado")});
document.addEventListener("input",e=>{if(e.target.id=="q"){const v=e.target.value.toLowerCase();document.querySelectorAll("#al .li").forEach(r=>r.style.display=r.dataset.n.includes(v)?"flex":"none")}});
draw();
</script></body></html>
